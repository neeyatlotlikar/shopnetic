<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %} | Shopnetic</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <nav class="bg-gray-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'core:index' %}" class="text-xl font-bold">Shopnetic</a>
            <div>
                <a href="{% url 'core:index' %}" class="px-4 hover:text-gray-400">Home</a>
                <a href="{% url 'core:index' %}" class="px-4 hover:text-gray-400">Products</a>
                <a href="{% url 'core:contact' %}" class="px-4 hover:text-gray-400">Contact</a>

                {% if request.user.is_authenticated %}
                <a href="{% url 'items:new' %}" class="px-4 py-3 font-bold hover:text-gray-400">
                    Add New Item</a>
                <a href="{% url 'dashboard:index' %}"
                    class="px-6 py-3 text-lg font-semibold bg-orange-400 hover:bg-orange-600 text-white rounded-xl hover:text-white-400">Dashboard</a>
                <a href="{% url 'core:logout' %}"
                    class="px-6 py-3 text-lg font-semibold bg-lime-400 hover:bg-lime-600 text-white rounded-xl hover:text-white-400">Logout</a>
                {% else %}
                <a href="{% url 'core:signup' %}"
                    class="px-6 py-3 text-lg font-semibold bg-orange-400 hover:bg-orange-600 text-white rounded-xl hover:text-white-400">
                    Sign Up</a>
                <a href="{% url 'core:login' %}"
                    class="px-6 py-3 text-lg font-semibold bg-lime-400 hover:bg-lime-600 text-white rounded-xl hover:text-white-400">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="px-6 py-6">
        {% block content %}

        {% endblock content %}
    </div>
    <footer class="bg-gray-800 flex justify-between text-white px-6 py-6">
        <div class="container w-2/3 pr-10">
            <p class="text-lg font-semibold">Shopnetic</p>
            <p class="text-base">Your one-stop shop for everything!</p>
        </div>
        <div class="w-1/3">
            <p class="text-lg font-semibold">Links</p>
            <ul class="text-base">
                <li><a href="#" class="hover:text-gray-400">Privacy Policy</a></li>
                <li><a href="#" class="hover:text-gray-400">Terms of Service</a></li>
            </ul>
        </div>
    </footer>
</body>

</html>
