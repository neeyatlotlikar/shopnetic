{% extends "core/base.html" %}

{% block title %}Inbox{% endblock %}

{% block content %}
<h1 class="mb-6 text-3xl font-bold">Inbox</h1>

<div class="space-y-6">
    {% for message in discourse.messages.all %}
    <div
        class="p-4 border border-gray-200 rounded-lg {% if message.created_by == request.user %} bg-teal-200 {% else %} bg-gray-100 {% endif %}">
        <div>
            <p class="mb-4"><strong>{{ message.created_at }} | {{ message.created_by.username }}</strong></p>
            <p>{{ message.content }}</p>
        </div>
    </div>
    {% endfor %}
</div>

<form action="." method="post" class="mt-4">
    {% csrf_token %}
    <div class="mb-4">
        <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Reply</label>
        {{ form.content }}
    </div>
    <button type="submit"
        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Send
    </button>
</form>

{% endblock content %}
